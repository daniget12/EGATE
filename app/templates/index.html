{% extends "base.html" %}

{% block title %}EGATE Talent Center{% endblock %}

{% block content %}
<section class="hero">
    <div class="hero-content">
        <div class="hero-logo-wrap">
            <img src="{{ url_for('static', filename='images/egate-logo.png') }}"
                 alt="EGATE Talent Center Logo"
                 class="hero-logo">
        </div>
        <h1>Cybersecurity Learning Platform</h1>
        <p class="hero-text">
            Practice cybersecurity skills through original CTF challenges,
            track your progress, and grow with structured courses.
        </p>
        <div class="hero-actions">
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Get Started</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Sign In</a>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Login &mdash; EGATE Talent Center{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/egate-logo.png') }}"
                 alt="EGATE Talent Center"
                 class="auth-logo-img">
        </div>
        <h1>Sign In</h1>
        <p class="auth-subtitle">Access your cybersecurity learning dashboard</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password">
            </div>
            <div class="form-group form-check">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </div>
    <!-- egate{h7ml_c0mm3n7s_r_fun} -->
</div>
{% endblock %}

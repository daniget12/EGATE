{% extends "base.html" %}

{% block title %}Reset Password &mdash; EGATE Talent Center{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Set New Password</h1>
        <p class="auth-subtitle">Please enter your new password.</p>
        
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <div class="form-group position-relative">
                <input type="password" name="password" id="reset-password" class="form-control" placeholder="New Password" required minlength="8" autofocus>
                <i class="fas fa-eye password-toggle" onclick="togglePassword('reset-password', this)"></i>
            </div>
            
            <div class="form-group position-relative">
                <input type="password" name="confirm_password" id="reset-confirm" class="form-control" placeholder="Confirm New Password" required minlength="8">
                <i class="fas fa-eye password-toggle" onclick="togglePassword('reset-confirm', this)"></i>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            iconElement.classList.remove('fa-eye');
            iconElement.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            iconElement.classList.remove('fa-eye-slash');
            iconElement.classList.add('fa-eye');
        }
    }
</script>

<style>
    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.2s;
    }
    .password-toggle:hover {
        color: var(--neon-cyan);
    }
</style>
{% endblock %}

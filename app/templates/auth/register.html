{% extends "base.html" %}

{% block title %}Register &mdash; EGATE Talent Center{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/egate-logo.png') }}"
                 alt="EGATE Talent Center"
                 class="auth-logo-img">
        </div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join the EGATE cybersecurity learning platform</p>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" autofocus minlength="3">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       autocomplete="new-password" minlength="8">
                <small class="form-hint">At least 8 characters</small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}

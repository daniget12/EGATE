{% extends "base.html" %}

{% block title %}Forgot Password &mdash; EGATE Talent Center{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we will send you a reset link.</p>
        
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
            <div class="form-group">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required autofocus>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        
        <div class="auth-footer mt-4">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
